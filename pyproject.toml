[project]
name = "texayadak-nabz"
version = "0.1.0"
description = "همگام‌سازی قیمت و موجودی بین ایساکو، حاسب و فروشگاه تکسایدک"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "requests>=2.31",
    "APScheduler>=3.10",
    "keyring>=24.0",
    "cryptography>=42.0",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyinstaller>=6.0"]

[project.scripts]
nabz = "nabz.ui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --strict-markers -q"
pythonpath = ["src"]
markers = ["realdata: needs res.xlsx present", "network: talks to a live server"]
