name: ساخت نسخهٔ ویندوز

# با هر push روی main و همچنین دستی از تب Actions اجرا می‌شود.
# خروجی: فایل اجرایی (exe) و فایل نصبی، به‌صورت Artifact قابل دانلود.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون ۳.۱۲
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pytest

      - name: اجرای تست‌ها
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: نوشتن شمارهٔ build در برنامه
        shell: pwsh
        run: |
          # فقط مقادیر ثابت‌ها عوض می‌شوند؛ منطق نمایش (تاریخ شمسی و ...) در خود فایل می‌ماند
          $file = "src/nabz/build_info.py"
          $commit = "${{ github.sha }}".Substring(0,7)
          $date = (Get-Date).ToString("yyyy-MM-dd")
          $content = Get-Content -Path $file -Raw -Encoding utf8
          $content = $content -replace '(?m)^BUILD_NUMBER = .*$', ('BUILD_NUMBER = "' + "${{ github.run_number }}" + '"')
          $content = $content -replace '(?m)^COMMIT = .*$', ('COMMIT = "' + $commit + '"')
          $content = $content -replace '(?m)^BUILD_DATE = .*$', ('BUILD_DATE = "' + $date + '"')
          Set-Content -Path $file -Value $content -Encoding utf8
          Select-String -Path $file -Pattern '^(BUILD_NUMBER|COMMIT|BUILD_DATE) ='

      - name: تزریق پیش‌فرض اتصال‌ها از Secrets
        shell: pwsh
        env:
          WOO_URL: ${{ secrets.WOO_URL }}
          WOO_KEY: ${{ secrets.WOO_KEY }}
          WOO_SECRET: ${{ secrets.WOO_SECRET }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ISACO_SCUS: ${{ secrets.ISACO_SCUS }}
          ISACO_USERNAME: ${{ secrets.ISACO_USERNAME }}
          ISACO_PASSWORD: ${{ secrets.ISACO_PASSWORD }}
        run: |
          $content = @"
          from __future__ import annotations

          DEFAULT_WOO_URL = "$env:WOO_URL"
          DEFAULT_WOO_KEY = "$env:WOO_KEY"
          DEFAULT_WOO_SECRET = "$env:WOO_SECRET"
          DEFAULT_WP_USER = "$env:WP_USER"
          DEFAULT_WP_APP_PASSWORD = "$env:WP_APP_PASSWORD"
          DEFAULT_ISACO_SCUS = "$env:ISACO_SCUS"
          DEFAULT_ISACO_USERNAME = "$env:ISACO_USERNAME"
          DEFAULT_ISACO_PASSWORD = "$env:ISACO_PASSWORD"
          DEFAULT_HASEB_CAL = r"D:\rahnama\HasebmDX8.001\DBF2\cal.DBF"
          "@
          Set-Content -Path "src/nabz/defaults.py" -Value $content -Encoding utf8

      - name: ساخت فایل اجرایی با PyInstaller
        run: pyinstaller packaging/nabz.spec

      - name: نصب Inno Setup
        run: choco install innosetup --no-progress -y

      - name: ساخت فایل نصبی
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      # فایل نصبی اصلی در Releases منتشر می‌شود؛ این Artifact فقط پشتیبان
      # کوتاه‌مدت است. پر شدن سهمیهٔ Artifact گیت‌هاب نباید انتشار را متوقف کند
      # (ساخت ۱۷ به همین دلیل شکست خورد). پوشهٔ کامل exe دیگر آپلود نمی‌شود.
      - name: آپلود فایل نصبی (پشتیبان کوتاه‌مدت)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TexayadakNabz-Setup
          path: packaging/Output/*.exe
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      # اثرانگشت فایل نصبی تا روی سیستم مقصد بشود سالم بودن دانلود را چک کرد
      - name: محاسبهٔ SHA256 فایل نصبی
        id: hash
        shell: pwsh
        run: |
          $f = Get-ChildItem packaging/Output/*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "size=$($f.Length)" >> $env:GITHUB_OUTPUT

      # انتشار فایل نصبی در صفحهٔ Releases برای دانلود ساده‌تر
      - name: انتشار در Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخهٔ نصبی ${{ github.run_number }}
          body: |
            فایل نصبی تکسایدک نبض.
            فایل `TexayadakNabz-Setup-*.exe` را دانلود و روی سیستم کارفرما نصب کنید.

            اندازهٔ دقیق: `${{ steps.hash.outputs.size }}` بایت
            SHA256: `${{ steps.hash.outputs.sha256 }}`

            بررسی سالم بودن فایل روی ویندوز (در cmd، در پوشهٔ دانلود):
            `certutil -hashfile TexayadakNabz-Setup-1.0.0.exe SHA256`
            اگر عدد با بالا یکی نبود، فایل ناقص دانلود شده؛ دوباره دانلود کنید.
          files: |
            packaging/Output/*.exe
          fail_on_unmatched_files: false
