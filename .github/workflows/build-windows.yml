name: ساخت نسخهٔ ویندوز

# با هر push روی main و همچنین دستی از تب Actions اجرا می‌شود.
# خروجی: فایل اجرایی (exe) و فایل نصبی، به‌صورت Artifact قابل دانلود.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پایتون ۳.۱۲
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pytest

      - name: اجرای تست‌ها
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: نوشتن شمارهٔ build در برنامه
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0,7)
          $date = (Get-Date).ToString("yyyy-MM-dd")
          $content = @"
          from __future__ import annotations

          APP_VERSION = "1.0"
          BUILD_NUMBER = "${{ github.run_number }}"
          COMMIT = "$commit"
          BUILD_DATE = "$date"


          def _to_fa(text: str) -> str:
              return str(text).translate(str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹"))


          def version_line() -> str:
              parts = [f"نسخهٔ {_to_fa(APP_VERSION)}"]
              if BUILD_NUMBER and BUILD_NUMBER != "محلی":
                  parts.append(f"build {_to_fa(BUILD_NUMBER)}")
              elif BUILD_NUMBER:
                  parts.append(BUILD_NUMBER)
              if COMMIT:
                  parts.append(f"({COMMIT})")
              line = "  —  ".join(parts[:2])
              if len(parts) > 2:
                  line += "  " + parts[2]
              if BUILD_DATE:
                  line += f"\nتاریخ ساخت: {_to_fa(BUILD_DATE)}"
              return line
          "@
          Set-Content -Path "src/nabz/build_info.py" -Value $content -Encoding utf8

      - name: ساخت فایل اجرایی با PyInstaller
        run: pyinstaller packaging/nabz.spec

      - name: نصب Inno Setup
        run: choco install innosetup --no-progress -y

      - name: ساخت فایل نصبی
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: آپلود فایل اجرایی (پوشهٔ کامل)
        uses: actions/upload-artifact@v4
        with:
          name: TexayadakNabz-exe
          path: dist/TexayadakNabz/

      - name: آپلود فایل نصبی
        uses: actions/upload-artifact@v4
        with:
          name: TexayadakNabz-Setup
          path: packaging/Output/*.exe
          if-no-files-found: warn

      # انتشار فایل نصبی در صفحهٔ Releases برای دانلود ساده‌تر
      - name: انتشار در Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخهٔ نصبی ${{ github.run_number }}
          body: |
            فایل نصبی تکسایدک نبض.
            فایل `TexayadakNabz-Setup-*.exe` را دانلود و روی سیستم کارفرما نصب کنید.
          files: |
            packaging/Output/*.exe
          fail_on_unmatched_files: false
